<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'"><title>Friend · 桌宠</title><style>
*{box-sizing:border-box}html,body{background:transparent;margin:0;width:100%;height:100%;overflow:hidden;font-family:"Microsoft YaHei",sans-serif;color:#4d6045}body{display:flex;align-items:flex-end;justify-content:center;user-select:none}button,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;color:inherit;background:#edf1e5;padding:4px 7px;font-size:11px}button:hover{background:#dce8ce}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}#pet-shell{width:var(--pet-panel-width,324px);min-width:var(--pet-panel-width,324px);max-width:var(--pet-panel-width,324px);flex:0 0 var(--pet-panel-width,324px);padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:4px}.fox{width:var(--fox-width,148px);height:var(--fox-height,168px);object-fit:contain;flex-shrink:0;cursor:grab;transform-origin:bottom center;filter:drop-shadow(0 3px 2px #57482817);-webkit-user-drag:none}.fox:active{cursor:grabbing}.fox.rest{animation:breathe 5.5s ease-in-out infinite}.fox.speaking{animation:speak 1.2s ease-in-out infinite}.fox.dragging{transform:rotate(-7deg)}#pet-reply{width:100%;min-width:0;max-width:100%;flex-shrink:0;overflow:hidden;border-radius:14px;background:#fffdf7f5;border:1px solid #dce4cd;box-shadow:0 2px 8px #63744c16;padding:8px 10px;max-height:212px;user-select:text;position:relative}.reply-head{min-width:0;display:flex;align-items:center;gap:5px;user-select:none;margin-bottom:3px;font-size:10px;color:#7d8d70}.reply-head span{min-width:0;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.reply-head button{font-size:10px;padding:1px 5px}#reply-text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-size:12px;max-height:165px;overflow-y:auto;scrollbar-width:thin}#pet-form{min-width:0;max-width:100%;height:52px;flex-shrink:0;width:100%;display:flex;align-items:center;gap:5px;padding:5px 6px;background:#fffdf7f2;border:1px solid #dce4cd;border-radius:12px}#pet-input{background:transparent;resize:none;border:0;outline:0;flex:1;min-width:0;height:40px;line-height:20px;font-size:12px;color:#435d38;user-select:text;padding:0 4px}#pet-input:focus{background:#f3f6ec;border-radius:5px}#pet-send{height:32px;flex-shrink:0}button:focus-visible{outline:2px solid #81986b}@keyframes breathe{50%{transform:scale(1.025)}}@keyframes speak{50%{transform:translateY(-3px) rotate(1deg)}}
</style></head><body><main id="pet-shell"><section id="pet-reply" hidden aria-label="桌宠回复"><div class="reply-head"><span id="reply-who">陪伴回复</span><button id="pet-stop-audio" title="停止语音" hidden>静音</button><button id="pet-close-reply" title="收起回复" aria-label="收起回复">×</button></div><div id="reply-text" role="log" aria-live="polite"></div></section><img class="fox" id="fox" src="../assets/pets/wanxiang-fox/sprites/sit.png" alt="狐狸，拖动移动位置" draggable="false"><form id="pet-form"><textarea id="pet-input" rows="2" maxlength="20000" aria-label="和桌宠说话" placeholder="和我说话… Enter 发送"></textarea><button id="pet-send" type="submit">发送</button><button id="pet-stop" type="button" hidden>停止</button></form></main><script src="pet.js"></script></body></html>
